name: Temporary length-variant PDF build

on:
  push:
    branches:
      - paper/d3-nonblind-manuscript-clarity

permissions:
  contents: read

jobs:
  build-variants:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0

      - name: Confirm generated source matches sections
        run: node research/validate-research-quality-gates.mjs

      - name: Compile both complete IEEE variants
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: |
            archsync-8page.tex
            archsync-12page.tex
          texlive_version: 2024
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Validate page count, references, glyphs, and retained hashes
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          mkdir -p output
          cp archsync-8page.log archsync-12page.log output/
          node scripts/validate-length-variants.mjs

      - name: Upload raw compiled evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: length-variants-${{ github.sha }}
          path: |
            archsync-8page.pdf
            archsync-12page.pdf
            supplementary/length-variant-validation.json
            output/archsync-8page.log
            output/archsync-12page.log
          if-no-files-found: warn
          retention-days: 7

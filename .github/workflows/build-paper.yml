name: Build paper

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0

      - name: Verify devcontainer contract
        run: node scripts/validate-devcontainer.mjs && node --test scripts/validate-devcontainer.test.mjs

      - name: Verify paper section structure
        run: node scripts/validate-paper-structure.mjs

      - name: Verify anonymous submission settings
        shell: bash
        run: |
          grep -F '\documentclass[sigconf,nonacm]{acmart}' main.tex
          grep -F '\PassOptionsToClass{anonymous}{acmart}' main-anonymous.tex
          grep -F '\input{main.tex}' main-anonymous.tex
          test "$(grep -c '^\\author{' main.tex)" -eq 4
          test "$(grep -c '^\\email{' main.tex)" -eq 4
          ! grep -F 'Anonymous Author' main.tex
          ! grep -F 'Anonymous Institution' main.tex

      - name: Verify research baseline and glossary
        run: node research/validate-baseline.mjs

      - name: Verify research decision namespace
        run: node research/validate-decision-log.mjs

      - name: Verify decision-free SLR calibration candidate packet
        run: node research/validate-slr-calibration-candidates.mjs

      - name: Verify RQ traceability matrix
        run: node research/validate-rq-traceability.mjs

      - name: Test research contracts with coverage gates
        run: |
          node --experimental-test-coverage \
            --test-coverage-include=research/validate-claim-evidence.mjs \
            --test-coverage-include=research/validate-literature-protocol.mjs \
            --test-coverage-include=research/freeze-literature-protocol.mjs \
            --test-coverage-include=research/verify-slr-review-provenance.mjs \
            --test-coverage-include=research/verify-slr-signed-attestation.mjs \
            --test-coverage-include=research/create-slr-signed-review.mjs \
            --test-coverage-include=research/verify-slr-sentinel-evidence.mjs \
            --test-coverage-include=research/build-slr-sentinel-ledger.mjs \
            --test-coverage-include=research/validate-search-queries.mjs \
            --test-coverage-include=research/validate-screening-criteria.mjs \
            --test-coverage-include=research/validate-literature-matrix.mjs \
            --test-coverage-include=research/verify-slr-screening-calibration.mjs \
            --test-coverage-include=research/build-slr-screening-calibration.mjs \
            --test-coverage-include=research/statistical-analysis.mjs \
            --test-coverage-include=research/validate-evaluation-report-scaffold.mjs \
            --test-coverage-include=research/validate-research-quality-gates.mjs \
            --test-coverage-include=research/validate-decision-log.mjs \
            --test-coverage-include=research/validate-slr-calibration-candidates.mjs \
            --test-coverage-lines=95 \
            --test-coverage-branches=88 \
            --test-coverage-functions=90 \
            --test \
            research/validate-claim-evidence.test.mjs \
            research/validate-literature-protocol.test.mjs \
            research/freeze-literature-protocol.test.mjs \
            research/verify-slr-review-provenance.test.mjs \
            research/verify-slr-signed-attestation.test.mjs \
            research/create-slr-signed-review.test.mjs \
            research/verify-slr-sentinel-evidence.test.mjs \
            research/build-slr-sentinel-ledger.test.mjs \
            research/validate-search-queries.test.mjs \
            research/validate-screening-criteria.test.mjs \
            research/validate-literature-matrix.test.mjs \
            research/validate-reference-quality-policy.test.mjs \
            research/verify-slr-screening-calibration.test.mjs \
            research/build-slr-screening-calibration.test.mjs \
            research/statistical-analysis.test.mjs \
            research/validate-evaluation-report-scaffold.test.mjs \
            research/validate-research-quality-gates.test.mjs \
            research/validate-decision-log.test.mjs \
            research/validate-slr-calibration-candidates.test.mjs

      - name: Verify governed SLR screening calibration when present
        shell: bash
        run: |
          if git ls-files --error-unmatch research/literature-screening-calibration.json >/dev/null 2>&1; then
            node research/build-slr-screening-calibration.mjs --check
          elif git ls-files \
            research/slr-review-record.md \
            research/evidence/slr-review/independent-slr-reviewer-attestation.json \
            research/evidence/slr-review/independent-slr-reviewer-attestation.sig | grep -q .; then
            echo "SLR-103 calibration summary is required before review evidence"
            exit 1
          else
            echo "SLR-103 calibration pending; no review evidence exists"
          fi
      - name: Verify claim-to-evidence contract
        run: node research/validate-claim-evidence.mjs

      - name: Verify literature review protocol
        run: node research/validate-literature-protocol.mjs

      - name: Verify versioned literature search queries
        run: node research/validate-search-queries.mjs

      - name: Verify versioned literature screening criteria
        run: node research/validate-screening-criteria.mjs

      - name: Verify versioned literature matrix contract
        run: node research/validate-literature-matrix.mjs

      - name: Verify reference quality and recency policy
        run: node research/validate-reference-quality-policy.mjs

      - name: Verify evaluation report and result-manifest scaffolds
        run: node research/verify-evaluation-report-scaffold.mjs

      - name: Verify manuscript and evidence quality gates
        run: node research/validate-research-quality-gates.mjs

      - name: Verify live SLR review provenance
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLR_CURRENT_PR: ${{ github.event.pull_request.number }}
          SLR_CURRENT_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: node research/verify-slr-review-provenance.mjs

      - name: Compile named and anonymous LaTeX variants
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: |
            main.tex
            main-anonymous.tex
          texlive_version: 2024
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Verify PDF content and double-blind redaction
        shell: bash
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends poppler-utils
          fi
          node scripts/verify-pdf-variants.mjs

      - name: Upload compiled PDFs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archsync-paper-${{ github.sha }}
          path: |
            main.pdf
            main-anonymous.pdf
          if-no-files-found: error
          retention-days: 30

  devcontainer-smoke:
    name: Devcontainer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0

      - name: Validate immutable container contract
        run: node scripts/validate-devcontainer.mjs && node --test scripts/validate-devcontainer.test.mjs

      - name: Install pinned devcontainer CLI
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare fresh lifecycle challenge
        run: node scripts/prepare-devcontainer-smoke.mjs

      - name: Build, start, and initialize declared devcontainer
        run: ./node_modules/.bin/devcontainer up --workspace-folder . --remove-existing-container --frozen-lockfile

      - name: Verify post-create evidence inside the container
        run: ./node_modules/.bin/devcontainer exec --workspace-folder . node scripts/verify-devcontainer-smoke.mjs

      - name: Upload container-built PDFs and lifecycle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archsync-devcontainer-smoke-${{ github.sha }}
          path: |
            .devcontainer/smoke-evidence.json
            main.pdf
            main-anonymous.pdf
          if-no-files-found: error
          retention-days: 30

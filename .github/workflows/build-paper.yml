name: Build paper

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0

      - name: Verify anonymous submission settings
        shell: bash
        run: |
          grep -F '\documentclass[sigconf,anonymous,nonacm]{acmart}' main.tex
          grep -F '\author{Anonymous Author(s)}' main.tex
          grep -F '\institution{Anonymous Institution}' main.tex

      - name: Verify research baseline and glossary
        run: node research/validate-baseline.mjs

      - name: Verify RQ traceability matrix
        run: node research/validate-rq-traceability.mjs

      - name: Test research contracts with coverage gates
        run: |
          node --experimental-test-coverage \
            --test-coverage-include=research/validate-claim-evidence.mjs \
            --test-coverage-include=research/validate-literature-protocol.mjs \
            --test-coverage-lines=95 \
            --test-coverage-branches=88 \
            --test-coverage-functions=90 \
            --test \
            research/validate-claim-evidence.test.mjs \
            research/validate-literature-protocol.test.mjs

      - name: Verify claim-to-evidence contract
        run: node research/validate-claim-evidence.mjs

      - name: Verify literature review protocol
        run: node research/validate-literature-protocol.mjs

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v7
        with:
          name: archsync-paper-${{ github.sha }}
          path: main.pdf
          if-no-files-found: error
          retention-days: 30

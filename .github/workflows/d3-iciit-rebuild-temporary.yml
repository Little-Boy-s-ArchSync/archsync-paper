# Temporary branch-only rebuild of the ICIIT draft after D3 wording changes.
# Remove this workflow after the retained package has been updated and checked.
name: Rebuild ICIIT D3 draft

on:
  push:
    branches:
      - paper/d3-nonblind-manuscript-clarity

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compile five ACM profiles using pinned TeX Live
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: |
            venues/iciit2027/iciit2027-review.tex
            venues/iciit2027/iciit2027-compact.tex
            venues/iciit2027/iciit2027-review-anonymous.tex
            venues/iciit2027/iciit2027-compact-anonymous.tex
            venues/iciit2027/iciit2027-supplement.tex
          work_in_root_file_dir: true
          texlive_version: 2024
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Retain final logs
        shell: bash
        run: |
          for profile in review compact review-anonymous compact-anonymous supplement; do
            cp "venues/iciit2027/iciit2027-$profile.log" "venues/iciit2027/$profile-build.log"
          done
      - name: Validate freshly compiled draft
        run: |
          python3 -m venv "$RUNNER_TEMP/venue-python"
          "$RUNNER_TEMP/venue-python/bin/pip" install pypdf==6.10.0
          "$RUNNER_TEMP/venue-python/bin/python" venues/iciit2027/validate.py --fresh
      - name: Upload five PDFs and exact logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iciit-d3-${{ github.sha }}
          path: |
            venues/iciit2027/iciit2027-*.pdf
            venues/iciit2027/*-build.log
            venues/iciit2027/validation.json
